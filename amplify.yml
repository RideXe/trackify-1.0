version: 1
applications:
  - appRoot: platform/apps/dashboard-web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
        build:
          commands:
            - cd ../.. && npm run build -w @trackify/dashboard-web
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
