version: 1
applications:
  - appRoot: platform/apps/dashboard-web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
        build:
          commands:
            # preBuild's `cd ../..` already left us in platform/ — Amplify runs phases in one
            # continuing shell, not a fresh one per phase, so cd'ing again here overshoots.
            - npm run build -w @trackify/dashboard-web
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
