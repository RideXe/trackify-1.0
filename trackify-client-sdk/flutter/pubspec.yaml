name: trackify_client_sdk
description: "Flutter plugin for background location tracking. Wraps the Trackify Client SDK for Android and iOS."
version: 0.0.25
repository: https://github.com/trackify/trackify-client-sdk

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.trackify.trackify_client_sdk
        pluginClass: TrackifyClientSdkPlugin
      ios:
        pluginClass: TrackifyClientSdkPlugin
